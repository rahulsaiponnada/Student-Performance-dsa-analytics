<!DOCTYPE html>
<html>
<head>
    <title>Student Analytics Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Student Performance & DSA Analytics</h1>
    <p>Track academic and coding progress</p>
</header>

<main>
    <section class="dashboard">
        <div class="card">
            <h3>Total Students</h3>
            <h2 id="students">0</h2>
        </div>

        <div class="card">
            <h3>Average Performance</h3>
            <h2 id="performance">0%</h2>
        </div>

        <div class="card">
            <h3>DSA Problems Solved</h3>
            <h2 id="solved">0</h2>
        </div>
    </section>

    <section class="panel">
        <h2>Project Overview</h2>
        <p>Manage student marks and track Data Structures
        and Algorithms progress in one place.</p>
    </section>
</main>

</body>
</html>
